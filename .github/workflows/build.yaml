name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Format (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Derive the ruff version from uv.lock so CI can never drift from the
          # version the project actually resolves (pyproject only sets a floor,
          # and dependabot does not see a hardcoded pin in this workflow).
          ruff_version=$(awk '/^name = "ruff"$/{f=1} f && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' uv.lock)
          if [ -z "$ruff_version" ]; then
            echo "::error::No ruff version found in uv.lock"
            exit 1
          fi
          echo "Installing ruff==$ruff_version"
          pip install "ruff==$ruff_version"

      # Nothing in this workflow consumes uv.lock, so drift against
      # pyproject.toml would otherwise go unnoticed indefinitely.
      - name: Set up uv
        if: matrix.python-version == '3.12'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Lockfile up to date
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # Stable check name for branch protection — succeeds only if every
  # matrix entry of `lint` succeeded.
  lint-gate:
    name: Lint & Format
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint matrix succeeded
        if: contains(needs.lint.result, 'failure') || contains(needs.lint.result, 'cancelled') || contains(needs.lint.result, 'skipped')
        run: exit 1

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Pytest
        run: uv run --python ${{ matrix.python-version }} pytest

  # Stable check name for branch protection — succeeds only if every
  # matrix entry of `test` succeeded.
  test-gate:
    name: Tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix succeeded
        if: contains(needs.test.result, 'failure') || contains(needs.test.result, 'cancelled') || contains(needs.test.result, 'skipped')
        run: exit 1

  release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - lint-gate
      - test-gate

    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}
      pulse_version: ${{ steps.pulse_version.outputs.value }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          semantic_version: 24

      - name: Export VERSION
        id: pulse_version
        if: always()
        run: |
          if [[ "${{ steps.semrel.outputs.new_release_published }}" == "true" ]]; then
            version="${{ steps.semrel.outputs.new_release_version }}"
          else
            version="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')" || true
          fi
          if [[ -z "$version" ]]; then
            echo "No version available; skipping export." >&2
            exit 0
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${version}"

