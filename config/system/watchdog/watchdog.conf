# Bluesnap — health-aware hardware watchdog (managed by bluesnap-setup).
#
# The watchdog daemon owns /dev/watchdog and keeps petting the BCM2835 hardware
# timer ONLY while the health check passes. If the board suffers a silent
# network-wedge hang (systemd alive, connectivity dead, nothing logged), the
# check below fails, the daemon stops petting, and the board hardware-resets.
#
# This is the failure Bluesnap actually hits: on 2026-09-19 a deployed node went
# dark and stayed down ~13h. The AP still showed it associated at -49 dBm the
# whole time, but it answered no ARP, no ICMP and no SSH, and it shipped no
# telemetry. Nothing on the box could recover it, and because this host is
# wireless there is no PoE port and no smart plug to cycle remotely — recovery
# required walking over to it.

watchdog-device = /dev/watchdog

# Run the health check this often (seconds). Must be < the hardware timeout.
interval = 10

# Upstream-reachability check. Returns non-zero when the network is wedged.
test-binary = /usr/local/sbin/bluesnap-net-check.sh
test-timeout = 8

# Tolerate transient blips (e.g. a Wi-Fi roam reconnect, which takes seconds):
# only force recovery after this many seconds of CONTINUOUS failure (~3 min).
retry-timeout = 180

# realtime=yes locks the daemon into RAM (mlockall) and runs it at a realtime
# scheduling priority, so it keeps petting the watchdog even under heavy load.
realtime = yes
priority = 1
