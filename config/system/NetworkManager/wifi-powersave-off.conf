# Disable Wi-Fi power-save on the Pi's brcmfmac radio.
#
# brcmfmac power-save lets the radio sleep between beacons, which on these
# boards causes association flapping and leaves the device intermittently — and
# sometimes permanently — unreachable while the AP still lists it as associated.
# Bluesnap is a headless, wireless-only node, so an unreachable radio means no
# SSH, no telemetry, and a speaker that has silently dropped out of the Snapcast
# mesh until somebody power-cycles the board by hand.
#
# NetworkManager applies this default to every Wi-Fi connection
# (value 2 = disable power-save).
[connection]
wifi.powersave = 2
